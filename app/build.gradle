plugins {
    alias(libs.plugins.android.application)
}

def firebaseEmulatorHost = project.findProperty("firebaseEmulatorHost") ?: "10.0.2.2"

// google-services.json comes from the team Firebase console and is not in the repo yet cause we have to unify with the other group cause is Java and the other lang. Without google-services.json the app still builds and falls back to in-memory repositories and a Logcat analytics sink.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

// the google maps key goes in local.properties (MAPS_API_KEY=...) so it is not uploaded to github
def localProperties = new Properties()
if (rootProject.file('local.properties').exists()) {
    rootProject.file('local.properties').withInputStream { localProperties.load(it) }
}

android {
    namespace 'com.example.parchapp'
    buildFeatures {
        buildConfig true
    }
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.example.parchapp"
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "MAPS_API_KEY", "\"${localProperties.getProperty('MAPS_API_KEY', '')}\""
    }

    buildTypes {
        debug {
            // Debug can run against the local Firebase Emulator Suite without a real project config.
            buildConfigField "boolean", "USE_FIREBASE_EMULATORS", "true"
            buildConfigField "String", "FIREBASE_EMULATOR_HOST", "\"${firebaseEmulatorHost}\""
        }
        release {
            buildConfigField "boolean", "USE_FIREBASE_EMULATORS", "false"
            buildConfigField "String", "FIREBASE_EMULATOR_HOST", '"127.0.0.1"'
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.analytics
    implementation libs.firebase.auth
    implementation libs.firebase.firestore
    implementation libs.firebase.functions
    implementation libs.play.services.auth
    implementation libs.play.services.location
    // zxing makes the qr code of the group link
    implementation libs.zxing.core
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}
